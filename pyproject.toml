[project]
name = "preference-optimization-landscape"
version = "0.1.0"
description = "DPO implemented from the loss function up, then KTO/ORPO/SimPO on the same data and eval, with the failure modes reproduced on purpose."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
